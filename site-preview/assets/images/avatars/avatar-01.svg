  <ellipse cx="73" cy="119" rx="9" ry="12" fill="#F2B390"/>
  <ellipse cx="74" cy="120" rx="5" ry="7" fill="#E39B76" opacity="0.6"/>
  <ellipse cx="167" cy="119" rx="9" ry="12" fill="#F2B390"/>
  <ellipse cx="166" cy="120" rx="5" ry="7" fill="#E39B76" opacity="0.6"/>

