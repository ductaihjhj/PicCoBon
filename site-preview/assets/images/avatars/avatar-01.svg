  </defs>

  <rect width="240" height="240" fill="url(#bg01)"/>
  <circle cx="120" cy="126" r="88" fill="#FFFFFF" opacity="0.38"/>

  <!-- Ponytail back sweep -->
  <path d="M150 56 C188 48, 204 92, 188 134 C178 156, 156 154, 152 138 C166 116, 162 82, 146 72 Z" fill="#4A2B16"/>
  <path d="M152 58 C184 54, 196 90, 182 124 C176 100, 170 76, 148 68 Z" fill="url(#hair01)"/>
  <ellipse cx="151" cy="66" rx="8" ry="11" transform="rotate(24 151 66)" fill="#2E8B57"/>

