<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Sunny Rally">
  <defs>
    <radialGradient id="bg01" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#F2FCF5"/>
      <stop offset="100%" stop-color="#C9F0D8"/>
    </radialGradient>
    <radialGradient id="skin01" cx="46%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE4D1"/>
      <stop offset="72%" stop-color="#FAC5A6"/>
      <stop offset="100%" stop-color="#EBA884"/>
    </radialGradient>
    <linearGradient id="hair01" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#7B4B2A"/>
      <stop offset="100%" stop-color="#4A2B16"/>
