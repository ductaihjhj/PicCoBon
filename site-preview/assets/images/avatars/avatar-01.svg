  <path d="M72 110 C70 64, 102 48, 125 50 C154 52, 170 74, 168 110 C162 96, 152 82, 120 82 C88 82, 78 96, 72 110 Z" fill="url(#hair01)"/>
  <path d="M92 54 C108 46, 134 48, 146 58 C132 54, 108 54, 92 54 Z" fill="#9A643B" opacity="0.5"/>

  <!-- Emerald Headband -->
