  <path d="M52 240 C56 188, 86 172, 120 172 C154 172, 184 188, 188 240 Z" fill="url(#shirt01)"/>
  <path d="M52 240 C58 196, 76 182, 92 178 L86 240 Z" fill="#6BCB77" opacity="0.55"/>
  <path d="M188 240 C182 196, 164 182, 148 178 L154 240 Z" fill="#2E8B57" opacity="0.22"/>
  <path d="M96 173 L120 198 L144 173 L135 168 L120 183 L105 168 Z" fill="#2E8B57"/>
  <path d="M97 174 L118 194 L104 198 L91 180 Z" fill="#6BCB77"/>
  <path d="M143 174 L122 194 L136 198 L149 180 Z" fill="#3DA36D"/>

