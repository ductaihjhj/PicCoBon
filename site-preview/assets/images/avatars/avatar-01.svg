  <ellipse cx="99" cy="117" rx="8.5" ry="9.5" fill="#1F2E25"/>
  <ellipse cx="141" cy="117" rx="8.5" ry="9.5" fill="#1F2E25"/>
  <circle cx="99" cy="118" r="5.5" fill="#2E6F4E"/>
  <circle cx="141" cy="118" r="5.5" fill="#2E6F4E"/>
  <circle cx="99" cy="118" r="3" fill="#121E17"/>
  <circle cx="141" cy="118" r="3" fill="#121E17"/>
  <circle cx="102" cy="113.5" r="2.6" fill="#FFFFFF"/>
  <circle cx="144" cy="113.5" r="2.6" fill="#FFFFFF"/>
  <circle cx="96" cy="121" r="1.2" fill="#FFFFFF" opacity="0.85"/>
  <circle cx="138" cy="121" r="1.2" fill="#FFFFFF" opacity="0.85"/>

  <!-- Cheeks, Cute Nose, Smile -->
  <ellipse cx="87" cy="130" rx="8" ry="4.5" fill="#FF8787" opacity="0.34"/>
  <ellipse cx="153" cy="130" rx="8" ry="4.5" fill="#FF8787" opacity="0.34"/>
  <path d="M118 125 Q120 129 123 127" fill="none" stroke="#DE9673" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M107 136 Q120 148 133 136 Z" fill="#FFFFFF"/>
  <path d="M106 135 Q120 149 134 135" fill="none" stroke="#B85D43" stroke-width="2.4" stroke-linecap="round"/>

  <!-- Pickleball Paddle tucked cleanly on right -->
  <g transform="translate(178 166) rotate(22)">
    <rect x="-22" y="-34" width="44" height="54" rx="14" fill="url(#paddle01)" stroke="#17251D" stroke-opacity="0.16" stroke-width="2"/>
    <rect x="-17" y="-29" width="34" height="44" rx="10" fill="#6BCB77" opacity="0.28"/>
    <rect x="-5" y="18" width="10" height="24" rx="4" fill="#17251D"/>
    <rect x="-6" y="21" width="12" height="4" rx="2" fill="#6BCB77"/>
