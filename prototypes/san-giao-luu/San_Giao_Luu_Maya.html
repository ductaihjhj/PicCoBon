<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sân giao lưu | Spike Pickleball</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f7f2;
      --ink: #17251d;
      --muted: #4a5950;
      --line: #dce6dc;
      --brand: #226b48;
      --wash: #eaf7ee;
      --lime: #d4ef92;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    header { background: #183b2c; color: #fff; }
    .top {
      max-width: 1280px; margin: auto; min-height: 65px; padding: 12px 30px;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .brand { display: flex; align-items: center; gap: 11px; font-size: .85rem; font-weight: 800; }
    .mark {
      width: 34px; height: 34px; background: var(--lime); color: #173b2b;
      display: grid; place-items: center; border-radius: 8px 8px 8px 2px;
      line-height: 1; font-weight: 950; font-size: 1.15rem; font-style: italic;
    }
    .preview-label { font-size: .81rem; color: #e2efd8; border: 1px solid #5e806e; border-radius: 99px; padding: 6px 11px; }
    main { max-width: 1280px; margin: auto; padding: 40px 30px 32px; }
    h1 { font-size: clamp(2.3rem, 5vw, 4.25rem); letter-spacing: -.055em; line-height: 1.03; margin: 0; }
    h1 + p { margin: 13px 0 25px; color: var(--muted); line-height: 1.6; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
    .world { border-radius: 15px; overflow: hidden; border: 1px solid #284d3e; background: #254d3d; }
    .scene { position: relative; isolation: isolate; }
    #map { width: 100%; height: auto; display: block; image-rendering: pixelated; }
    .map-note {
      position: absolute; top: 12px; left: 12px; padding: 6px 8px;
      font-size: .71rem; font-weight: 750; letter-spacing: .05em; color: #ecf9e5;
      background: #18392df2; border: 1px solid #547d61; border-radius: 5px;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #186242; outline-offset: 3px; }
    #maya {
      position: absolute; left: 36%; top: 70%; transform: translate(-50%, -100%);
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 4px;
      min-width: 62px; min-height: 68px; padding: 2px 5px 0; border: 0; background: none;
      -webkit-tap-highlight-color: transparent;
    }
    #maya:focus-visible { outline-color: #effbdb; border-radius: 7px; }
    #maya::before {
      content: ""; position: absolute; bottom: -3px; width: 37px; height: 10px; border-radius: 50%;
      background: #132b3180; z-index: -1;
    }
    #maya[aria-expanded="true"]::before, #maya:hover::before { outline: 2px solid #dbfca1; }
    #sprite { display: block; width: auto; height: clamp(49px, 8vw, 74px); image-rendering: pixelated; }
    .nameplate {
      background: #14362a; color: #fff; padding: 3px 7px; border-radius: 4px;
      border: 1px solid #b3d98b; white-space: nowrap; font-size: .71rem; font-weight: 800;
    }
    .dot { display: inline-block; width: .45rem; height: .45rem; border-radius: 50%; background: #a6e271; vertical-align: .05em; margin-right: 4px; }
    .controls {
      display: flex; flex-wrap: wrap; gap: 7px; padding: 11px 12px;
      border-top: 1px solid #39664f; background: #193c2e; color: #fff;
    }
    .controls button {
      min-height: 42px; padding: 4px 12px; border: 1px solid #638574; border-radius: 7px;
      background: #244a39; color: #fff; font-size: .81rem; font-weight: 700;
    }
    .controls button:hover { background: #375d49; }
    .controls button[aria-pressed="true"] { background: var(--lime); border-color: var(--lime); color: #1c392b; }
    .controls button:focus-visible { outline-color: #effbdb; }
    .controls .motion-toggle { margin-left: auto; }
    aside { display: grid; gap: 12px; }
    .card { border: 1px solid var(--line); border-radius: 13px; padding: 18px; background: #fff; }
    .card h2 { margin: 0 0 12px; font-size: 1rem; }
    .member {
      width: 100%; display: flex; align-items: center; text-align: left; gap: 10px; min-height: 52px;
      color: var(--ink); border: 1px solid var(--line); border-radius: 8px; background: #f7faf5; padding: 7px 9px;
    }
    .member:hover { background: var(--wash); }
    .avatar { width: 39px; height: 39px; border-radius: 6px; object-fit: cover; flex: none; background: #d9f0bd; }
    .member strong, .member small { display: block; }
    .member small { margin-top: 2px; color: var(--muted); }
    .member .arrow { margin-left: auto; color: var(--brand); font-size: 1.1rem; }
    #profile { outline: none; }
    .profile-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .profile-head h2 { margin: 0; }
    .close { width: 36px; height: 36px; border-radius: 7px; background: #fff; border: 1px solid var(--line); font-size: 1.2rem; color: var(--brand); }
    .profile-title { display: flex; align-items: center; gap: 11px; margin-top: 12px; }
    .profile-title strong { font-size: 1.23rem; }
    .sample { font-size: .77rem; color: var(--brand); font-weight: 750; }
    .profile-copy { font-size: .88rem; line-height: 1.65; color: var(--muted); margin: 13px 0; }
    dl { margin: 0; font-size: .84rem; }
    dl div { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line); padding: 10px 0 0; margin-top: 9px; }
    dt { color: var(--muted); }
    dd { margin: 0; font-weight: 700; }
    [hidden] { display: none !important; }
    @media (max-width: 840px) {
      .layout { grid-template-columns: 1fr; }
      aside { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); align-items: start; }
    }
    @media (max-width: 520px) {
      main { padding: 26px 14px; }
      .top { padding: 10px 14px; }
      .map-note { top: 6px; left: 6px; font-size: .64rem; padding: 4px 6px; }
      .controls { padding: 8px; gap: 5px; }
      .controls button { min-height: 44px; padding: 4px 9px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand"><span class="mark" aria-hidden="true">S</span> Spike Pickleball Club</div>
      <span class="preview-label">Bản thử</span>
    </div>
  </header>
  <main>
    <h1>Sân giao lưu</h1>
    <p>Chạm vào Maya trên sân để xem hồ sơ giao lưu.</p>
    <div class="layout">
      <section class="world" aria-label="Sân pickleball pixel">
        <div class="scene">
          <canvas id="map" width="640" height="374" aria-hidden="true"></canvas>
          <span class="map-note">SÂN SPIKE</span>
          <button id="maya" type="button" aria-label="Xem hồ sơ Maya Smash" aria-controls="profile" aria-expanded="false">
            <span class="nameplate"><span class="dot"></span>Maya</span>
            <canvas id="sprite" width="90" height="94" aria-hidden="true"></canvas>
          </button>
        </div>
        <div class="controls" role="group" aria-label="Thử chuyển động của Maya">
          <button type="button" data-action="idle" aria-pressed="true">Đứng</button>
          <button type="button" data-action="walk" aria-pressed="false">Đi bộ</button>
          <button type="button" data-action="wave" aria-pressed="false">Vẫy tay</button>
          <button type="button" data-action="swing" aria-pressed="false">Vung vợt</button>
          <button type="button" id="auto-motion" class="motion-toggle" aria-pressed="true">Tự hoạt động</button>
        </div>
      </section>
      <aside>
        <section class="card" aria-labelledby="people-heading">
          <h2 id="people-heading">Hội viên mẫu</h2>
          <button type="button" class="member" id="member" aria-controls="profile" aria-expanded="false">
            <img class="avatar" alt=""><span><strong>Maya Smash</strong><small>Sẵn sàng giao lưu</small></span><span class="arrow" aria-hidden="true">›</span>
          </button>
        </section>
        <section class="card" id="profile" hidden tabindex="-1" aria-labelledby="profile-heading">
          <div class="profile-head"><h2 id="profile-heading">Hồ sơ giao lưu</h2><button id="close" class="close" type="button" aria-label="Đóng hồ sơ">×</button></div>
          <div class="profile-title"><img class="avatar" alt=""><div><strong>Maya Smash</strong><div class="sample">Hồ sơ mẫu</div></div></div>
          <p class="profile-copy">Thích đánh đôi và làm quen bạn mới. Thường rảnh vào tối thứ Sáu.</p>
          <dl><div><dt>Trình độ tự khai</dt><dd>Giao lưu</dd></div><div><dt>Lối chơi</dt><dd>Đánh đôi</dd></div></dl>
        </section>
      </aside>
    </div>
  </main>

    const map = document.querySelector("#map").getContext("2d");
    const sprite = document.querySelector("#sprite").getContext("2d");
    const maya = document.querySelector("#maya");
    const member = document.querySelector("#member");
    const profile = document.querySelector("#profile");
    const actions = [...document.querySelectorAll("[data-action]")];
    const autoToggle = document.querySelector("#auto-motion");
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

    function drawCourt() {
      function rect(color, x, y, w, h) {
        map.fillStyle = color;
        map.fillRect(x, y, w, h);
      }
      function tree(x, y) {
        rect("#1b3c31", x - 6, y + 26, 45, 18);
        rect("#795740", x + 14, y + 19, 8, 20);
        rect("#244d3b", x, y + 6, 38, 23);
        rect("#306245", x + 4, y, 30, 24);
        rect("#3d7650", x + 7, y, 21, 13);
        rect("#518258", x + 11, y + 3, 10, 4);
      }

      rect("#2b5945", 0, 0, 640, 374);
      for (let y = 0; y < 374; y += 12) {
        for (let x = 0; x < 640; x += 13) {
          const n = (x * 17 + y * 11 + (x / 13) * (y / 12)) % 29;
          if (n < 5) rect(n < 3 ? "#2e6049" : "#335f48", x + 2, y + 2, 3, 2);
        }
      }

      rect("#50714f", 0, 35, 640, 7);
      rect("#69906a", 0, 34, 640, 2);
      [20, 83, 146, 209, 272, 335, 398, 461, 524, 587, 630].forEach(x => {
        rect("#203d32", x, 25, 4, 25);
        rect("#83a282", x, 24, 5, 3);
      });

      rect("#244438", 64, 54, 514, 283);
      rect("#4b826a", 60, 48, 520, 281);
      rect("#84a98b", 64, 52, 512, 273);
      rect("#56917f", 68, 56, 504, 265);
      rect("#1d4b52", 82, 67, 476, 242);
      rect("#306777", 87, 71, 466, 231);
      rect("#377487", 91, 75, 458, 223);
      rect("#447f90", 252, 75, 136, 223);
      for (let y = 80; y < 296; y += 8) rect("#ffffff06", 91, y, 458, 1);
      const chalk = "#e9edcc";
      rect(chalk, 91, 75, 458, 3);
      rect(chalk, 91, 295, 458, 3);
      rect(chalk, 91, 75, 3, 223);
      rect(chalk, 546, 75, 3, 223);
      rect(chalk, 251, 75, 3, 223);
      rect(chalk, 386, 75, 3, 223);
      rect(chalk, 91, 185, 162, 3);
      rect(chalk, 388, 185, 161, 3);

      rect("#203e4988", 323, 65, 13, 243);
      rect("#223c44", 314, 65, 10, 243);
      for (let y = 70; y < 307; y += 6) rect("#527582", 316, y, 7, 1);
      rect("#c6dbcb", 314, 65, 2, 243);
      [63, 307].forEach(y => {
        rect("#203238", 309, y, 17, 8);
        rect("#a0b4a5", 310, y, 14, 2);
      });

      [88, 450].forEach(x => {
        rect("#1b4134", x - 2, 342, 57, 16);
        rect("#795c46", x, 339, 52, 11);
        rect("#b69061", x, 339, 52, 3);
        rect("#bc9a6c", x, 346, 52, 3);
        rect("#443d2c", x + 3, 349, 4, 7);
        rect("#443d2c", x + 44, 349, 4, 7);
      });
      [18, 583].forEach(x => { tree(x, 54); tree(x + 3, 290); });
      rect("#b1c977", 583, 188, 5, 3);
      rect("#a6bf72", 601, 226, 3, 3);
      rect("#b1c977", 36, 152, 3, 4);
    }

    let opener;
    function openProfile(event) {
      opener = event.currentTarget;
      profile.hidden = false;
      maya.setAttribute("aria-expanded", "true");
      member.setAttribute("aria-expanded", "true");
      profile.focus({ preventScroll: true });
      if (profile.getBoundingClientRect().bottom > innerHeight) {
        profile.scrollIntoView({ block: "nearest" });
      }
    }
    function closeProfile() {
      profile.hidden = true;
      maya.setAttribute("aria-expanded", "false");
      member.setAttribute("aria-expanded", "false");
      opener?.focus();
    }

    const atlas = new Image();
    const duration = sequence => sequence.reduce((sum, frame) => sum + frame.ms, 0);
    let action = "idle";
    let started = performance.now();
    let facing = 1;
    let position = 36;
    let walkFrom = position;
    let walkTo = position;
    let painted = -1;
    let paintedFacing = 0;
    let nextAutomatic = started + 3800;
    let automaticStep = 0;
    const ambientActions = ["walk", "wave", "walk", "swing"];
    autoToggle.setAttribute("aria-pressed", String(!reduceMotion.matches));

    function selectAction(name, now = performance.now()) {
      if (name === "walk") {
        walkFrom = position;
        walkTo = position < 35 ? 45 : 23;
        facing = walkTo > position ? 1 : -1;
      }
      action = name;
      started = now;
      actions.forEach(button => button.setAttribute("aria-pressed", String(button.dataset.action === name)));
    }

    function currentFrame(sequence, elapsed) {
      let progress = elapsed % duration(sequence);
      for (const frame of sequence) {
        if (progress < frame.ms) return frame.index;
        progress -= frame.ms;
      }
      return sequence[0].index;
    }

    function render(now) {
      if (action === "idle" && profile.hidden && !reduceMotion.matches &&
          autoToggle.getAttribute("aria-pressed") === "true" && now >= nextAutomatic) {
        selectAction(ambientActions[automaticStep % ambientActions.length], now);
        automaticStep += 1;
        nextAutomatic = now + 5400;
      }
      const elapsed = now - started;
      if (action === "walk") {
        const progress = Math.min(1, elapsed / 1850);
        if (!reduceMotion.matches) {
          position = walkFrom + (walkTo - walkFrom) * progress;
          maya.style.left = position + "%";
        }
        if (progress === 1) selectAction("idle", now);
      } else if (action !== "idle" && elapsed >= duration(assets.actions[action])) {
        selectAction("idle", now);
      }

      const sequence = assets.actions[action];
      const frameTime = Math.max(0, now - started);
      const frame = reduceMotion.matches
        ? sequence[action === "wave" || action === "swing" ? 1 : 0].index
        : currentFrame(sequence, frameTime);
      const direction = action === "walk" ? facing : 1;
      if (frame !== painted || direction !== paintedFacing) {
        painted = frame;
        paintedFacing = direction;
        const { width, height } = assets;
        sprite.setTransform(1, 0, 0, 1, 0, 0);
        sprite.clearRect(0, 0, width, height);
        if (direction < 0) sprite.setTransform(-1, 0, 0, 1, width, 0);
        sprite.drawImage(atlas, frame * width, 0, width, height, 0, 0, width, height);
      }
      requestAnimationFrame(render);
    }

    document.querySelectorAll(".avatar").forEach(image => { image.src = assets.avatar; });
    drawCourt();
    atlas.onload = () => {
      sprite.canvas.width = assets.width;
      sprite.canvas.height = assets.height;
      sprite.imageSmoothingEnabled = false;
      requestAnimationFrame(render);
    };
    atlas.src = assets.atlas;
    actions.forEach(button => button.addEventListener("click", () => {
      selectAction(button.dataset.action);
      nextAutomatic = performance.now() + 6500;
    }));
    autoToggle.addEventListener("click", () => {
      const enabled = autoToggle.getAttribute("aria-pressed") === "true";
      if (enabled) selectAction("idle");
      autoToggle.setAttribute("aria-pressed", String(!enabled));
      nextAutomatic = performance.now() + 1600;
    });
    if (reduceMotion.matches) autoToggle.hidden = true;
    reduceMotion.addEventListener("change", () => {
      autoToggle.hidden = reduceMotion.matches;
      autoToggle.setAttribute("aria-pressed", String(!reduceMotion.matches));
      selectAction("idle");
      nextAutomatic = performance.now() + 3800;
    });
    maya.addEventListener("click", openProfile);
    member.addEventListener("click", openProfile);
    document.querySelector("#close").addEventListener("click", closeProfile);
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !profile.hidden) closeProfile();
    });
  </script>
